<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Recommender System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .book-card {
            height: 480px;
            border-radius: 12px;
            overflow: hidden;
            transition: 0.3s;
            background: white;
        }

        .book-card:hover {
            transform: scale(1.03);
        }

        .book-img {
            height: 280px;
            width: 100%;
            object-fit: contain;   
            background-color: #f5f5f5;
            padding: 12px;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
        }

        .card-text {
            font-size: 14px;
            color: #555;
        }
    </style>

</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="#">Book Recommender System</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarText">

      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" href="/">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/Recommend">Recommend</a>
        </li>
      </ul>

      <span class="navbar-text fw-semibold">
        - Aditi Gupta
      </span>

    </div>
  </div>
</nav>


<div class="container mt-4">
    <div class="row">

        <div class="col-12 mb-3">
            <h1 style="font-size:40px; font-weight:700;">Top 50 Books</h1>
        </div>

        {% for i in range(book_name|length) %}
            <div class="col-md-3 mt-4">
                <div class="card book-card shadow-sm">

                    <img class="book-img" src="{{ image[i] }}" alt="Book Image">

                    <div class="card-body">
                        <h5 class="card-title">{{ book_name[i] }}</h5>
                        <p class="card-text">{{ book_author[i] }}</p>
                        <p class="card-text">⭐ Ratings: {{ rating[i] }}</p>
                        <p class="card-text">🗳 Votes: {{ votes[i] }}</p>
                    </div>

                </div>
            </div>
        {% endfor %}

    </div>
</div>

</body>
</html>
